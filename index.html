<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارت دعوت ❤️</title>
<style>
body{
margin:0;height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:tahoma;overflow:hidden}
.card{background:white;padding:40px;border-radius:25px;text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);width:90%;max-width:450px}
h1{color:#ff4d6d}
.buttons{margin-top:30px;position:relative;height:150px}
button{border:none;padding:12px 30px;border-radius:50px;font-size:18px;cursor:pointer}
#yes{background:#4CAF50;color:white}
#no{background:#ff4d6d;color:white;position:absolute;left:60%;top:0}
</style>
</head>
<body>
<div class="card">
<h1>❤️ یه سوال مهم ❤️</h1>
<h2>آیا با عارف دیت میای؟ 😌</h2>
<div class="buttons">
<button id="yes">بله 😍</button>
<button id="no">نه 🙃</button>
</div>
</div>
<script>
const noBtn=document.getElementById("no");
function moveButton(){
const maxX=window.innerWidth-120;
const maxY=window.innerHeight-80;
noBtn.style.position="fixed";
noBtn.style.left=(Math.random()*maxX)+"px";
noBtn.style.top=(Math.random()*maxY)+"px";
}
noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("touchstart",moveButton);
document.getElementById("yes").addEventListener("click",()=>{
document.body.innerHTML=`<div style="height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;font-family:tahoma;background:linear-gradient(135deg,#ff9a9e,#fad0c4);text-align:center;"><h1>🥳 عالیه!</h1><h2>منتظر پیامتم ❤️</h2></div>`;
});
</script>
</body>
</html>
